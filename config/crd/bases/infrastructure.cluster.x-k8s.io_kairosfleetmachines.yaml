---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: kairosfleetmachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: KairosFleetMachine
    listKind: KairosFleetMachineList
    plural: kairosfleetmachines
    singular: kairosfleetmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Whether the infrastructure machine is provisioned
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    - description: Target AuroraBoot group
      jsonPath: .spec.group
      name: Group
      type: string
    - description: Claimed node provider ID
      jsonPath: .spec.providerID
      name: ProviderID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KairosFleetMachine is the Schema for the kairosfleetmachines API. It is the
          infrastructure side of a Cluster API Machine, backed by an AuroraBoot node claimed
          from a group.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KairosFleetMachineSpec defines the desired state of KairosFleetMachine.
            properties:
              group:
                description: |-
                  group is the AuroraBoot group to claim a node from. It accepts either the group's
                  name or its ID; the controller resolves a name to the group's ID before claiming.
                  The group must already exist in AuroraBoot and hold enrolled, unclaimed nodes. A
                  group that does not resolve is a transient "GroupNotFound" wait, and a resolved
                  group with no unclaimed nodes is a transient "waiting for capacity" wait; neither
                  is a failure.
                minLength: 1
                type: string
              providerID:
                description: |-
                  providerID is the identifier for the claimed AuroraBoot node, in the form
                  "kairos-fleet://<id>". The controller sets it once the node has rejoined as Online
                  after the reboot that applies its bootstrap cloud-config, at the same time it sets
                  status.initialization.provisioned. It is not validated or protected against edits:
                  users must not set or change it.
                type: string
            required:
            - group
            type: object
          status:
            description: KairosFleetMachineStatus defines the observed state of KairosFleetMachine.
            properties:
              addresses:
                description: |-
                  addresses is the list of addresses reported for the claimed node, mirrored from
                  AuroraBoot's reported node addresses (for example InternalIP and Hostname). The
                  controller refreshes it each time the node is observed rejoined, not while the
                  node is claimed but still waiting to rejoin.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: conditions represents the observations of a KairosFleetMachine's
                  current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureMessage:
                description: |-
                  failureMessage is a human-readable description of the failure named by
                  failureReason, and is set together with it.
                type: string
              failureReason:
                description: |-
                  failureReason is a programmatic failure indication. The controller sets it when the
                  claimed AuroraBoot node no longer exists (reason "NodeMissing"); the Ready condition
                  carries the same reason. (Deprecated in the CAPI v1beta2 contract but still
                  surfaced.)
                type: string
              initialization:
                description: initialization provides observations of the KairosFleetMachine
                  initialization process.
                properties:
                  provisioned:
                    description: |-
                      provisioned is true once a node has been claimed, its bootstrap cloud-config applied,
                      and the node has been rebooted and has rejoined AuroraBoot as Online. This is the
                      Cluster API v1beta2 InfraMachine initialization signal read by the core Machine
                      controller. Once true it stays true; the Ready condition reports the current state.
                    type: boolean
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
