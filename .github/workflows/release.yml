name: Release

# Tagging vX.Y.Z builds and pushes a multi-arch image, signs it keylessly with
# cosign, attaches an SBOM + provenance, and publishes a GitHub release with the
# clusterctl assets (infrastructure-components.yaml pinned to the image digest,
# metadata.yaml, cluster-template.yaml).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push the image to ghcr.io
      id-token: write # cosign keyless signing (OIDC) + provenance
      attestations: write # SLSA provenance attestation
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Render clusterctl release manifests (image pinned by digest)
        run: make release-manifests IMG="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # A tag containing a hyphen (e.g. v0.1.0-beta.1) is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The curated notes for this release. With generate_release_notes also
          # set, the action prepends this body to GitHub's generated section, so
          # a release reads as the notes we wrote followed by the "What's
          # Changed" list and its PR and contributor links.
          #
          # This makes docs/release-notes/<tag>.md REQUIRED at the tagged commit:
          # the step fails if it is missing. That is deliberate — a release with
          # no notes should not publish — but it means writing the notes is part
          # of preparing a release, not an afterthought.
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
          files: |
            out/infrastructure-components.yaml
            out/metadata.yaml
            out/cluster-template.yaml
            sbom.spdx.json
