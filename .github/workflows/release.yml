name: Release

# Tagging vX.Y.Z first runs an OSV scan of the tagged tree's dependencies and
# stops on any finding the scanner fails on. It then builds and pushes a
# multi-arch image, signs it keylessly with cosign, attaches an SBOM +
# provenance, and publishes a GitHub release with the clusterctl assets
# (infrastructure-components.yaml pinned to the image digest, metadata.yaml,
# cluster-template.yaml).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A tag push matches none of osv-scanner.yml's triggers (pull_request, push to
  # main, the Monday cron), and test.yml's govulncheck does not run on tags
  # either. Without this job a release cut between two Mondays can publish while
  # an advisory is already open against an unchanged dependency, with nothing
  # red anywhere.
  #
  # The pin below is the same google/osv-scanner-action commit osv-scanner.yml
  # pins (b1d267ae, the v2.7.0 tag); bump them together. The reusable workflows
  # there call the action at 0a65f82, an ancestor whose osv-scanner-action/
  # action.yml is identical, with the same default arguments ("-r ./"). The
  # scanner loads an osv-scanner.toml found next to a scanned manifest by
  # itself, so an ignore added there applies to both scans.
  #
  # The scan reads the tagged tree, not main: the release is what ships. The
  # trade-off is that an ignore added in the tagged commit silences this gate,
  # so a change to an osv-scanner.toml wants review on its own.
  #
  # What it does not cover: findings the scanner's Go call analysis marks as
  # uncalled do not fail it, the Go standard library is not checked (test.yml's
  # govulncheck covers it on main and pull requests), and the image's OS
  # packages are not scanned.
  #
  # The action is called directly, not through the reusable workflow, and
  # without continue-on-error, so a finding and a scanner error both fail the
  # job: an osv.dev outage, a network failure or a malformed config cannot let a
  # tag through on a green gate. The scanner image maps "no package sources
  # found" to success, so the scan also writes its results to a file, and the
  # next step fails the gate when that file is missing or is not a scan result:
  # a scan that read nothing passes nothing.
  #
  # No SARIF upload, so no security-events: write. osv-scanner.yml owns the
  # Security > Code scanning view, keyed on main.
  osv:
    name: osv-scan (release gate)
    runs-on: ubuntu-latest
    # A hung scan fails closed anyway, but would hold the release for the
    # six-hour job default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            -r
            ./

      - name: Require scan results
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s osv-results.json ]; then
            echo "::error::The OSV scan produced no results file, so it scanned nothing. Refusing to release."
            exit 1
          fi
          # A completed scan always writes a JSON document with a "results"
          # array (empty when nothing is vulnerable). "No package sources
          # found" writes no file at all, which the check above catches.
          if ! jq -e 'has("results")' osv-results.json >/dev/null; then
            echo "::error::The OSV results file is not a scan result. Refusing to release."
            exit 1
          fi
          vulns=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' osv-results.json)
          echo "OSV scan completed; ${vulns} vulnerability record(s) in the results, counting any the scanner marked uncalled."

  release:
    name: Build, sign and publish
    needs: osv
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push the image to ghcr.io
      id-token: write # cosign keyless signing (OIDC) + provenance
      attestations: write # SLSA provenance attestation
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          # A release must build from the tagged tree alone. `make
          # release-manifests` runs `go install` for kustomize and
          # controller-gen, which render the published
          # infrastructure-components.yaml, and Go trusts a restored module or
          # build cache without checking it again. The scanner container in the
          # osv job above runs on this tag's cache scope first, pulled by a tag
          # rather than a digest; with caching on, a repointed scanner image
          # could plant the exact cache key this step restores.
          cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # Same reason: do not docker-load a binfmt image tarball from the
          # Actions cache into the job that signs the release.
          cache-image: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless)
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Render clusterctl release manifests (image pinned by digest)
        run: make release-manifests IMG="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # A tag containing a hyphen (e.g. v0.1.0-beta.1) is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The curated notes for this release. With generate_release_notes also
          # set, the action prepends this body to GitHub's generated section, so
          # a release reads as the notes we wrote followed by the "What's
          # Changed" list and its PR and contributor links.
          #
          # This makes docs/release-notes/<tag>.md REQUIRED at the tagged commit:
          # the step fails if it is missing. That is deliberate — a release with
          # no notes should not publish — but it means writing the notes is part
          # of preparing a release, not an afterthought.
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
          files: |
            out/infrastructure-components.yaml
            out/metadata.yaml
            out/cluster-template.yaml
            sbom.spdx.json
