name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to 1.26 while the other workflows are on 1.27, and it is
          # golangci-lint that pins it: the linter parses the standard library
          # of whatever Go is installed, and panics on sources newer than the
          # Go it was itself built with —
          #   panic: file requires newer Go version go1.27
          #          (application built with go1.26)
          # v2.12.2 is built on go 1.25.0 and even v2.13.2 (2026-08-27) on
          # go 1.26.0, so no released version can lint against a 1.27 stdlib.
          # Raise this only together with a golangci-lint built on 1.27+.
          go-version: "1.26"
          check-latest: true

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
