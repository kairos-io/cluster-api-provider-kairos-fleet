# Cluster API cluster template for a Kairos fleet cluster.
#
# Render with:
#   clusterctl generate cluster <name> \
#     --infrastructure kairos-io-fleet \
#     --kubernetes-version v1.36.1 \
#     --control-plane-machine-count 1 --worker-machine-count 1 > cluster.yaml
#
# A fleet cluster composes three providers: this infrastructure provider
# (KairosFleet*), the Kairos bootstrap provider (KairosConfigTemplate), and the
# Kairos control-plane provider (KairosControlPlane). Install all three with
# `clusterctl init`; see docs/INSTALL.md in the provider repository. With
# clusterctl v1.13 or v1.14 the kairos-io-fleet provider name must first be
# registered in clusterctl.yaml (same page). Nodes are claimed from AuroraBoot
# groups.
#
# The cluster needs two Secrets in its namespace:
#   - the AuroraBoot admin token (AURORABOOT_TOKEN_SECRET, key `token`), before
#     this is applied;
#   - the k3s server token the worker KairosConfigTemplate references
#     (K3S_TOKEN_SECRET_NAME, key `token`), whose value is
#     /var/lib/rancher/k3s/server/token read from the control-plane node. Create
#     it once that node is up (docs/QUICKSTART.md, step 5). A worker's
#     KairosFleetMachine stays at WaitingForBootstrapData until its Machine has
#     spec.bootstrap.dataSecretName set.
#
# Every node claimed for this cluster must also permit the two commands the
# provider issues, apply-cloud-config and reboot. AuroraBoot's install-agent
# defaults do NOT include apply-cloud-config, and a node enrolled with those
# defaults fails its first bootstrap apply; enrol with
# AURORABOOT_ALLOWED_COMMANDS covering apply-cloud-config and reboot.
#
# This example uses k3s, the reference path. For k0s set distribution to k0s on
# the KairosControlPlane and both KairosConfigTemplates, and swap the worker's
# k3sTokenSecretRef for workerTokenSecretRef holding the output of
# `k0s token create --role worker` run on the control-plane node.
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - ${POD_CIDR:=192.168.0.0/16}
    services:
      cidrBlocks:
        - ${SERVICE_CIDR:=10.128.0.0/12}
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KairosControlPlane
    name: ${CLUSTER_NAME}-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: KairosFleetCluster
    name: ${CLUSTER_NAME}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KairosFleetCluster
metadata:
  name: ${CLUSTER_NAME}
spec:
  # Operator-supplied endpoint (e.g. a kube-vip VIP or a managed load balancer).
  controlPlaneEndpoint:
    host: ${CONTROL_PLANE_ENDPOINT_HOST}
    port: ${CONTROL_PLANE_ENDPOINT_PORT:=6443}
  auroraboot:
    url: ${AURORABOOT_URL}
    adminTokenSecretRef:
      name: ${AURORABOOT_TOKEN_SECRET:=auroraboot-admin-token}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KairosControlPlane
metadata:
  name: ${CLUSTER_NAME}-control-plane
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT:=1}
  version: ${KUBERNETES_VERSION}
  distribution: k3s
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: KairosFleetMachineTemplate
      name: ${CLUSTER_NAME}-control-plane
  kairosConfigTemplate:
    name: ${CLUSTER_NAME}-control-plane
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KairosFleetMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-control-plane
spec:
  template:
    spec:
      group: ${FLEET_CONTROL_PLANE_GROUP:=control-plane}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KairosConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-control-plane
spec:
  template:
    spec:
      distribution: k3s
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT:=1}
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${KUBERNETES_VERSION}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KairosConfigTemplate
          name: ${CLUSTER_NAME}-md-0
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: KairosFleetMachineTemplate
        name: ${CLUSTER_NAME}-md-0
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KairosFleetMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  template:
    spec:
      group: ${FLEET_WORKER_GROUP:=workers}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KairosConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  template:
    spec:
      # Worker role, with the join token read from the Secret named by
      # K3S_TOKEN_SECRET_NAME (see the header and docs/QUICKSTART.md, step 5).
      role: worker
      distribution: k3s
      k3sTokenSecretRef:
        name: ${K3S_TOKEN_SECRET_NAME:=${CLUSTER_NAME}-k3s-token}
        key: token
